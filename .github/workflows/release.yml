name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift run MacPulseTests

      - name: Build & Package App (DMG + ZIP)
        env:
          APP_BUNDLE: ${{ github.workspace }}/build/MacPulse.app
        run: |
          chmod +x scripts/build_app.sh scripts/make_dmg.sh
          ./scripts/build_app.sh
          ./scripts/make_dmg.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          name: "MacPulse ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
